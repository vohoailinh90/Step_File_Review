name: Build Windows exe

# Builds QuickSTEP.exe — a single file containing Python, viewer.html and the
# cascadio/OpenCASCADE tessellation engine, for colleagues with no Python.
on:
  push:
    branches: [main, "claude/**"]
    # Tagging is how a downloadable release is cut: the build then publishes
    # QuickSTEP.exe as a release asset, which anyone can download without a
    # GitHub account.   git tag v0.1.0 && git push origin v0.1.0
    tags: ["v*"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write        # needed only to attach the exe to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller cascadio numpy

      - name: Build QuickSTEP.exe
        run: pyinstaller --clean --noconfirm quickstep.spec

      - name: Smoke-test the executable
        run: |
          dist\QuickSTEP.exe --check
          if ($LASTEXITCODE -ne 0) { throw "--check failed" }
          python tests\make_cube_step.py cube.step
          dist\QuickSTEP.exe cube.step --convert-only --out cube.glb
          if (-not (Test-Path cube.glb)) { throw "conversion produced no GLB" }
          Write-Host "converted cube.step -> cube.glb ($((Get-Item cube.glb).Length) bytes)"

      - uses: actions/upload-artifact@v4
        with:
          name: QuickSTEP-windows-x64
          path: dist/QuickSTEP.exe
          retention-days: 90

      # A release asset downloads without a GitHub account, unlike the artifact
      # above, so this is the copy to hand to a colleague. A tag build publishes
      # that version; any other build refreshes the rolling "latest-windows"
      # release, whose download URL therefore never changes.
      - name: Publish as a downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: >-
            Standalone Windows build of QuickSTEP. No Python, no CAD software
            and no admin rights needed: download QuickSTEP.exe, double-click it,
            and drop STEP files onto the page that opens. The first start takes
            a few seconds while it unpacks. The file is unsigned, so Windows may
            warn once (More info -> Run anyway).
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
              $tag = $env:GITHUB_REF_NAME
              $title = "QuickSTEP $tag"
              $extra = @()
          } else {
              $tag = 'latest-windows'
              $title = "QuickSTEP - latest Windows build"
              $extra = @('--prerelease')
              # Recreate it so the tag follows the commit that was built.
              gh release delete $tag --yes --cleanup-tag 2>$null
          }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
              gh release create $tag dist\QuickSTEP.exe --target $env:GITHUB_SHA --title $title --notes $env:NOTES @extra
          } else {
              gh release upload $tag dist\QuickSTEP.exe --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw "publishing the release failed" }
          Write-Host "Download: https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/QuickSTEP.exe"
